<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Chat &mdash; 4R BET</title>
  <link rel="icon" type="image/png" href="favicon/photo_2026-09-29_17-33-54-removebg-preview.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">
        <img class="logo-img" src="LOGO/images%20(2).png" alt="4R BET">
      </a>

      <div class="menu-wrap">
        <button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="menuDrop">
          <span></span><span></span><span></span>
        </button>
        <nav class="menu-drop" id="menuDrop">
          <a class="menu-item" href="index.html">Home Page</a>
          <a class="menu-item" href="mailbox.html">Mailbox</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="page-top">
      <a class="btn btn--ghost btn--back" href="index.html">&larr; Back to Home</a>
    </div>
    <div class="page-head">
      <h1 class="page-title">Complain page</h1>
    </div>

    <div class="panel">
      <!-- IMAGE PLACEHOLDER (baad me add karenge) -->
      <div class="img-box img-box--empty"><span class="img-note">Chat Image (baad me)</span></div>

      <div class="chat-box">
        <div class="chat-messages" id="chatMessages">
          <div class="msg msg--agent">
            <span class="msg-name">Support Agent</span>
            <p>Assalam-o-Alaikum! Kya help chahiye? Apna message likhiye.</p>
          </div>
        </div>

        <form class="chat-input" id="chatForm">
          <input type="text" id="chatField" placeholder="Apna message likhiye..." autocomplete="off" required>
          <button type="submit" class="btn btn--send">Send</button>
        </form>
      </div>

      <button class="btn btn--block" id="startChat">Start Live Chat</button>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span class="year"></span> 4R BET &mdash; All Rights Reserved</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
