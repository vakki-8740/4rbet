  <main class="page">
    <div class="page-top">
      <a class="btn btn--ghost btn--back" href="index.html">&larr; Back to Home</a>
    </div>
    <div class="page-head">
      <h1 class="page-title">Complain page</h1>
    </div>

    <div class="panel">

      <h2 class="panel-title">Email Verification Form</h2>

      <form class="form" id="emailForm" novalidate>

        <label class="field">
          <span class="label">User Name</span>
          <input type="text" name="userName" placeholder="Apna user name daalein" required>
        </label>

        <label class="field">
          <span class="label">Mobile Number</span>
          <input type="tel" name="mobile" placeholder="10 digit mobile number" required>
        </label>

        <label class="field">
          <span class="label">Email ID</span>
          <input type="email" name="email" placeholder="example@email.com" required>
        </label>

        <label class="field">
          <span class="label">Game Account Password</span>
          <input type="password" name="password" placeholder="Game account password" required>
        </label>

        <label class="field">
          <span class="label">Enter Your Email ID <span class="label-note">(For Verification)</span></span>
          <input type="email" name="verifyEmail" placeholder="Jo email verify karni hai" required>
        </label>

        <label class="field">
          <span class="label">Upload Issue Image</span>
          <span class="file-box">
            <input type="file" name="issueImage" accept="image/*" required>
          </span>
          <span class="file-name" data-name></span>
          <span class="upload-ok"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg><span>Image Uploaded</span></span>
        </label>

        <button type="submit" class="btn btn--block"><span class="btn-text">Send Complain</span></button>
      </form>
    </div>
