; ==================================================================
; 4R BET API - php.ini  (PHPRC=/config/ se load hota hai)
; PHP 8.3, wasi runner
; ==================================================================

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = Off

expose_php = Off

memory_limit = 256M

; ---- errors: logs me jaayein, browser me kabhi nahi ----
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log =
log_errors_max_len = 4096
ignore_repeated_errors = On

; ---- uploads (complaint images / chat attachments) ----
file_uploads = On
upload_max_filesize = 8M
post_max_size = 24M
max_file_uploads = 12

; ---- time ----
max_execution_time = 30
max_input_time = 30
date.timezone = UTC

; ---- mbstring / json ----
mbstring.language = "neutral"
mbstring.internal_encoding = UTF-8
serialize_precision = -1

; ---- opcache: deploy ke baad code change nahi hota, isliye timestamps off ----
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 4000
opcache.save_comments = 1

; ---- security hardening ----
allow_url_fopen = On
allow_url_include = Off
enable_post_data_reading = On
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; ---- extensions (Wasmer ke php module me pehle se available) ----
extension=curl
extension=mbstring
extension=hash
extension=json
extension=ctype
