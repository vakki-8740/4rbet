kind: wasmer.io/App.v0
# ==================================================================
# 4R BET API - Wasmer Edge app config
#
# Deploy:  cd api && wasmer deploy
# URL:     https://4rbet-api-<USERNAME>.wasmer.app
#
# "owner" me apna Wasmer username daalein (ya `wasmer deploy` bolne par
# CLI khud current user se infer kar leta hai - tab is line ko comment
# kar sakte hain).
# ==================================================================
owner: YOUR_WASMER_USERNAME
name: 4rbet-api

# package = is folder ka wasmer.toml (php module)
package: .

# ---- env (Edge par inject hote hain) ----
env:
  APP_ENV: production
  # JSON database yahan rahegi - MUST be volume ke andar (sirf /data writable hai)
  DATA_DIR: /data/4rbet
  # Frontend Vercel par hai -> CORS me sirf yahi origins allow
  ALLOWED_ORIGINS: "https://4rbet.vercel.app,http://localhost:8080,http://127.0.0.1:8080"
  # Upload public URL base (file links isi se bante hain)
  PUBLIC_BASE_URL: "https://4rbet-api-YOUR_WASMER_USERNAME.wasmer.app"
  # ---- Google Drive (backup + upload mirror) ----
  # Folder "4R-BET Backups" aapke Drive me bana hua hai:
  #   https://drive.google.com/drive/folders/1-3gjSRjFRJ7yG80WzPJwmVMc7qchN4gk
  # Dhyan dein: isi folder ko use karne ke liye OAuth scope
  #   https://www.googleapis.com/auth/drive   (full) chahiye.
  # Sirf "drive.file" scope use karna ho to ise KHAALI ("") chhod dein -
  # tab API apna folder khud bana legi (usme likhne ki permission hoti hai).
  GDRIVE_FOLDER_ID: "1-3gjSRjFRJ7yG80WzPJwmVMc7qchN4gk"
  # mode: off | backup | mirror | both  (settings.json se bhi badal sakta hai)
  GDRIVE_MODE: "backup"

  # ---- SECRETS (yahan values NAHI likhni) ----
  #   wasmer app secrets create APP_KEY "$(openssl rand -hex 32)"
  #   wasmer app secrets create GDRIVE_REFRESH_TOKEN "1//0..."
  #   wasmer app secrets create GDRIVE_CLIENT_ID ".....apps.googleusercontent.com"
  #   wasmer app secrets create GDRIVE_CLIENT_SECRET "GOCSPX-....."
  #   wasmer app secrets create CRON_KEY "$(openssl rand -hex 16)"
  # Ya dashboard -> app -> Settings -> Environment Vars

# ---- volume: JSON "database" ki disk ----
volumes:
  - name: 4rbet-data
    mount: /data

# ---- scaling ----
# JSON files par single writer safe rehta hai, isliye ek hi instance.
# (Wasmer docs: volumes multi-writer DB ke liye ideal nahi - isliye
#  JsonStore me flock + atomic rename + .bak recovery hai.)
scaling:
  mode: single_concurrency

# ---- cold start kam karne ke liye ----
capabilities:
  instaboot:
    requests:
      - path: /api/health

redirect:
  force_https: true

# NOTE: capabilities.database jaan-boojh kar NAHI lagaya -
# database JSON file me hai (aapka decision), managed SQL me nahi.
